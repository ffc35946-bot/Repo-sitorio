name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK (Base)
      uses: android-actions/setup-android@v4
      # Não passamos 'packages' aqui para evitar o erro do pacote 'tools'
      
    - name: Install Build Tools, Platform and NDK
      run: |
        # Instala os pacotes necessários um por um para evitar erros de parsing
        sdkmanager "platform-tools"
        sdkmanager "build-tools;33.0.2"
        sdkmanager "platforms;android-33"
        sdkmanager "ndk;25.2.9519653"
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.0
        
    - name: Build with Gradle
      run: |
        gradle assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FF_Hack_APK
        path: app/build/outputs/apk/debug/app-debug.apk
