# =====================================================================
# CORREÇÃO DA CONFIGURAÇÃO DO GRADLE
# =====================================================================

cd ~/OverlayProject

# 1. Configura o settings.gradle para procurar plugins no repositório do Google
cat << 'EOF' > settings.gradle
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "OverlayProject"
include ':app'
EOF

# 2. Limpa o build.gradle raiz (o plugin será aplicado apenas no app/build.gradle)
cat << 'EOF' > build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF

# 3. Garante que o app/build.gradle use a versão correta do plugin
cat << 'EOF' > app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.overlay'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.overlay"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags "" }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
EOF

# 4. Envia as alterações para o GitHub
echo "[*] Enviando correções para o GitHub..."
git add .
git commit -m "Fix: Add google() repository to pluginManagement and correct build files"
git push

echo "[+] CORREÇÃO ENVIADA! Verifique a aba Actions no GitHub."
