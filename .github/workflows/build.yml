name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        # Instala o SDK, Build Tools e o NDK necessário para o C++
        packages: 'platform-tools;build-tools;33.0.2;platforms;android-33;ndk;25.2.9519653'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.0
        
    - name: Build with Gradle
      run: |
        # Roda o Gradle diretamente, sem precisar do wrapper
        gradle assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FF_Hack_APK
        path: app/build/outputs/apk/debug/app-debug.apk
